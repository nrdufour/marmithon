server = "irc.ircnet.com:6667"
nick = "Marmithon"
ssl = false
channels = ["#souk", "#debian-fr"]

# Identd server configuration (RFC 1413)
identdEnabled = true
identdPort = "113"
identdUsername = "marmithon"

# Prometheus metrics server
metricsEnabled = true
metricsPort = "9090"

# LLM !ask command (OpenRouter)
# The key can also come from the OPENROUTER_API_KEY environment variable
llmApiKey = ""
llmModel = "z-ai/glm-5.3-flash"

# Automatic reconnection (always enabled)
reconnectDelaySeconds = 30
reconnectMaxAttempts = 0  # 0 = unlimited
